# Builds the plugin with the Rack SDK on every platform the VCV Library ships (Linux x64,
# macOS arm64 / x64, Windows x64), runs the core tests, and keeps each .vcvplugin as an
# artifact. Native runners stand in for VCV's cross toolchain: same SDK, the platform's
# own compiler (gcc / Apple clang / MinGW gcc).
#
# Also builds the Max for Live devices (the engine as WebAssembly with Emscripten, the
# simulator tests, the .amxd files) into one zip, the same for Windows and macOS Live.
# A v* tag (matching plugin.json's version) publishes the Rack plugins as a GitHub Release;
# an m4l-v* tag (matching m4l/VERSION) publishes the M4L zip on its own.
name: Build

on:
  push:
    branches: [main, m4l]
    tags: ['v*', 'm4l-v*']
  pull_request:
  workflow_dispatch:

env:
  RACK_SDK_VERSION: 2.6.6
  EMSDK_VERSION: 7.0.0

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            sdk: lin-x64
          - name: macOS arm64
            os: macos-latest
            sdk: mac-arm64
          - name: macOS x64
            os: macos-15-intel
            sdk: mac-x64
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q && sudo apt-get install -y -q zstd jq
          else
            command -v zstd >/dev/null || brew install zstd
            command -v jq >/dev/null || brew install jq
          fi

      - name: Rack SDK
        run: |
          curl -sSfL -o sdk.zip "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-${{ matrix.sdk }}.zip"
          unzip -q sdk.zip -d "$RUNNER_TEMP"
          echo "RACK_DIR=$RUNNER_TEMP/Rack-SDK" >> "$GITHUB_ENV"

      - name: Build
        run: make -j4 dist RACK_DIR="$RACK_DIR"

      - name: Test
        run: make test RACK_DIR="$RACK_DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: Jezric-${{ matrix.sdk }}
          path: dist/*.vcvplugin

  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make zip unzip zstd
            mingw-w64-x86_64-gcc
            jq

      - name: Rack SDK
        run: |
          curl -sSfL -o sdk.zip "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-win-x64.zip"
          unzip -q sdk.zip -d sdk
          echo "RACK_DIR=$(pwd)/sdk/Rack-SDK" >> "$GITHUB_ENV"

      - name: Build
        run: make -j4 dist RACK_DIR="$RACK_DIR"

      - name: Test
        run: make test RACK_DIR="$RACK_DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: Jezric-win-x64
          path: dist/*.vcvplugin

  m4l:
    name: Max for Live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Emscripten
        run: |
          git clone -q --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"

      - name: Engine
        run: python3 m4l/engine/build.py

      - name: Test
        run: node m4l/tests/sim.js

      - name: Devices
        run: python3 m4l/device/build.py

      - name: Package
        run: |
          version=$(tr -d '[:space:]' < m4l/VERSION)
          dir="$RUNNER_TEMP/Talea"
          mkdir -p "$dir"
          # The devices load their scripts from their own folder (not frozen): keep them together.
          cp m4l/build/*.amxd m4l/build/*.js m4l/build/*.svg LICENSE "$dir/"
          (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/Talea-M4L-$version.zip" Talea)
          unzip -l "Talea-M4L-$version.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Talea-M4L
          path: Talea-M4L-*.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows, m4l]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches plugin.json
        run: |
          version=$(jq -r .version plugin.json)
          if [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "tag ${GITHUB_REF_NAME} doesn't match plugin.json version $version"; exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: Jezric-*
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  release-m4l:
    name: Release (Max for Live)
    if: startsWith(github.ref, 'refs/tags/m4l-v')
    needs: [m4l]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches m4l/VERSION
        run: |
          version=$(tr -d '[:space:]' < m4l/VERSION)
          if [ "${GITHUB_REF_NAME}" != "m4l-v$version" ]; then
            echo "tag ${GITHUB_REF_NAME} doesn't match m4l/VERSION $version"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: Talea-M4L
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          name: Talea for Max for Live ${{ env.VERSION }}
          body_path: m4l/RELEASE_NOTES.md
          files: artifacts/*
          make_latest: true
